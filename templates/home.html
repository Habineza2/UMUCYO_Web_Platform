
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMUCYO Business Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 55px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 550px;
            width: 90%;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            color: #17365D;
            margin-bottom: 15px;
        }

        h1 {
            color: #24364b;
            margin-bottom: 15px;
        }

        p {
            color: #718096;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #e5f7ec;
            color: #18794e;
            border-radius: 25px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">UMUCYO</div>

        <h1>Business Manager</h1>

        <p>
            Welcome to UMUCYO Business Manager.
            Your business management platform is being prepared.
        </p>

        <div class="status">
            Application is running
        </div>

    </div>

</body>
</html>
